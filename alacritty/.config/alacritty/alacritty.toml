[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 8

blur = true
decorations = "full"
opacity = 0.7

dimensions.columns = 100
dimensions.lines = 32

[font]
normal.family = "JetBrainsMono Nerd Font"
size = 12

[keyboard]
bindings = [
    { key = "F11", action = "ToggleFullscreen" }
]
